# @system codegen
# @status generated
# @edit change codegen_output 'repo-lefthook-config' transform, then regenerate
#
# Lefthook hook orchestration for bun-foundation-circuit-breaker. Generated by
# repo-lefthook-config@2.0.0 — see that transform for why pre-push is a lefthook
# SCRIPT (not a command): a command is skipped on a tag-only push ("no matching
# push files"), so the transport would not run on exactly the pushes whose refs
# matter most; a script fires unconditionally. The pre-push script body lives
# in .lefthook/pre-push/scala-guard (emitted by the
# repo-lefthook-prepush-script@1.0.0 transform).
#
# Lefthook is transport-only (single-call-per-hook-trigger doctrine): each stage
# has exactly ONE invocation of the guard daemon at 127.0.0.1:3109 (pre-push via
# a script, the others via commands). The daemon runs every active guard_rule
# for the trigger in one in-process pass.
#
# Activate (per-host):
#   cd bun-foundation-circuit-breaker && lefthook install

prepare-commit-msg:
  commands:
    co-pane:
      # Appends a `Co-Pane: <identity>` trailer to every commit so we can
      # always tell which session/agent made the commit. Identity is
      # derived correct-by-construction from TMUX_PANE (interactive panes)
      # or SCALA_FLEET_SLOT (fleet agents). Idempotent on amend.
      run: |
        msg_file="{1}"
        grep -q '^Co-Pane:' "$msg_file" 2>/dev/null && exit 0
        resolve_cli() {
          local pid=$1 comm
          for _ in 1 2 3 4 5 6 7 8; do
            [ -z "$pid" ] && break
            [ "$pid" = "0" ] && break
            [ "$pid" = "1" ] && break
            comm=$(ps -o comm= -p "$pid" 2>/dev/null | tr -d ' ')
            case "$comm" in
              claude|opencode|codex|claude-*|opencode-*|oc-*|codex-*)
                echo "$comm"; return ;;
            esac
            pid=$(ps -o ppid= -p "$pid" 2>/dev/null | tr -d ' ')
          done
          echo "shell"
        }
        if [ -n "${TMUX_PANE:-}" ]; then
          session="$(tmux display-message -p -t "$TMUX_PANE" '#{session_name}' 2>/dev/null || echo unknown)"
          window="$(tmux display-message -p -t "$TMUX_PANE" '#{window_name}' 2>/dev/null || echo '?')"
          cli="$(resolve_cli $PPID)"
          identity="pane:${session}:${window}/${cli}"
        elif [ -n "${SCALA_FLEET_WINDOW_NAME:-}" ]; then
          identity="lane:${SCALA_FLEET_WINDOW_NAME}"
        elif [ -n "${SCALA_FLEET_SLOT:-}" ]; then
          identity="fleet:${SCALA_FLEET_SLOT}"
        else
          identity=''
        fi
        [ -z "$identity" ] && exit 0
        printf 'Co-Pane: %s\n' "$identity" >> "$msg_file"

pre-commit:
  commands:
    scala-guard:
      run: |
        staged=$(if [ -n "${SCALA_GUARD_STAGED_FILES:-}" ]; then echo "$SCALA_GUARD_STAGED_FILES"; else git diff --cached --name-only --diff-filter=ACMR 2>/dev/null; fi)
        candidate_tree=$(git write-tree 2>/dev/null)
        if [ -z "$candidate_tree" ]; then printf 'pre-commit mechanism fault: cannot materialize the candidate index tree; fix the isolated index before committing\n' >&2; exit 1; fi
        repo_root="${LEFTHOOK_REPO_ROOT:-$(git rev-parse --show-toplevel 2>/dev/null)}"
        repo_name=$(basename "$repo_root")
        workspace_root=$(dirname "$repo_root")
        arr=$(echo "$staged" | sed '/^$/d' | sed "s#^#${repo_name}/#" | sed 's/.*/"&"/' | paste -sd, -)
        payload="{\"staged_files\":[${arr}],\"cwd\":\"${repo_root}\",\"workspaceRoot\":\"${workspace_root}\",\"candidate_tree\":\"${candidate_tree}\"}"
        result="$(printf '%s' "$payload" | curl -s --connect-timeout 2 --max-time "${PRE_COMMIT_CONTENT_BUDGET_SECONDS:-180}" -X POST "http://127.0.0.1:3109/hook/pre-commit" -H 'Content-Type: application/json' --data-binary @- 2>&1)"
        curl_exit=$?
        if [ $curl_exit -ne 0 ] || [ -z "$result" ]; then
          scala-tools guard hook-miss pre-commit --repo "$repo_root" --reason "curl_exit=$curl_exit" >/dev/null 2>&1 || true
          exit 0
        fi
        if printf '%s\n' "$result" | grep -q '"decision":"block"'; then
          printf '%s\n' "$result" >&2
          exit 1
        fi
        exit 0
      skip:
        - run: 'cache="${XDG_RUNTIME_DIR:-/tmp}/scala-guard-switch-state"; if [ -f "$cache" ]; then value="$(cat "$cache")"; if [ "$value" = "off" ] || grep -qx "pre-commit=0" <<<"$value"; then exit 0; fi; fi; scala-tools master-switch is-off pre-commit'

pre-push:
  parallel: false
  scripts:
    scala-guard:
      # A lefthook SCRIPT (not a command) so it fires UNCONDITIONALLY — even on
      # a tag-only publish push (commit already pushed, then git tag + push
      # --follow-tags), where a command is skipped ("no matching push files").
      # The script body (master-switch self-check + curl + payload) is
      # .lefthook/pre-push/scala-guard, emitted by the
      # repo-lefthook-prepush-script@1.0.0 transform.
      runner: bash
